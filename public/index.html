<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BrightPath Learn — Ask the docs</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; color: #1d2433; }
    form { display: flex; gap: 8px; }
    input[type=text] { flex: 1; padding: 10px; font-size: 16px; }
    button { padding: 10px 16px; font-size: 16px; cursor: pointer; }
    .opts { margin: 8px 0 20px; font-size: 14px; color: #555; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 16px; }
    .answered { border-color: #2e7d32; }
    .not_found { border-color: #ed6c02; }
    .model_unavailable, .error { border-color: #c62828; background: #fff5f5; }
    blockquote { margin: 8px 0; padding-left: 12px; border-left: 3px solid #bbb; color: #444; }
    small { color: #777; }
  </style>
</head>
<body>
  <h1>Ask BrightPath Learn</h1>
  <p>Answers come only from the three supplied (fictional) documents.</p>
  <form id="ask">
    <label for="q" hidden>Question</label>
    <input id="q" type="text" placeholder="e.g. When is the group coaching session?" required />
    <button type="submit">Ask</button>
  </form>
  <div class="opts">
    <label><input type="checkbox" id="fail" /> Simulate model failure (for testing)</label>
  </div>
  <div id="out" aria-live="polite"></div>

  <script>
    const out = document.getElementById('out');
    const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    document.getElementById('ask').addEventListener('submit', async (e) => {
      e.preventDefault();
      out.innerHTML = '<p>Thinking… (the first question loads the local model and can take a minute)</p>';
      let data;
      try {
        const res = await fetch('/api/ask', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question: document.getElementById('q').value, simulateFailure: document.getElementById('fail').checked }),
        });
        data = await res.json();
      } catch {
        data = { status: 'error', message: 'Could not reach the server.' };
      }
      out.innerHTML = render(data);
    });

    function render(d) {
      let html = `<div class="card ${esc(d.status)}">`;
      if (d.status === 'answered') {
        html += `<p><strong>${esc(d.answer)}</strong></p><p>Source:</p>`;
        for (const s of d.sources) html += `<div><b>${esc(s.id)}</b> — ${esc(s.title)}<blockquote>${esc(s.quote)}</blockquote></div>`;
      } else if (d.status === 'not_found') {
        html += `<p><strong>${esc(d.answer)}</strong></p>`;
      } else {
        html += `<p><strong>${esc(d.message)}</strong></p>`;
        if (d.detail) html += `<p><small>${esc(d.detail)}</small></p>`;
        if (d.relatedDocuments?.length) html += `<p>Documents that look relevant: ${d.relatedDocuments.map((r) => esc(r.id + ' — ' + r.title)).join(', ')}</p>`;
      }
      if (d.model) html += `<p><small>Model: ${esc(d.model)}</small></p>`;
      return html + '</div>';
    }
  </script>
</body>
</html>
